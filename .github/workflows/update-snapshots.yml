name: Update Visual Regression Snapshots

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: 'Commit message for snapshot updates'
        required: false
        default: 'Update visual regression snapshots'
      target_branch:
        description: 'Target branch for the pull request'
        required: false
        default: ''

jobs:
  update-snapshots:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Update snapshots
      run: npm run test:visual
    - name: Check for changes
      id: verify-changed-files
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo "changed=false" >> $GITHUB_OUTPUT
        fi
    - name: Create Pull Request
      if: steps.verify-changed-files.outputs.changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Create a new branch
        BRANCH_NAME="update-snapshots-$(date +%Y%m%d-%H%M%S)"
        git checkout -b "$BRANCH_NAME"
        
        # Add and commit changes
        git add tests/
        git commit -m "${{ github.event.inputs.commit_message }}"
        
        # Push branch
        git push origin "$BRANCH_NAME"
        
        # Create pull request
        TARGET_BRANCH="${{ github.event.inputs.target_branch }}"
        if [ -z "$TARGET_BRANCH" ]; then
          TARGET_BRANCH="${{ github.ref_name }}"
        fi
        gh pr create \
          --title "${{ github.event.inputs.commit_message }}" \
          --body "Visual regression snapshots updated by GitHub Actions workflow." \
          --base "$TARGET_BRANCH" \
          --head "$BRANCH_NAME"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: No changes detected
      if: steps.verify-changed-files.outputs.changed == 'false'
      run: echo "No snapshot changes detected"