name: Update Slides

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  update-slides:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Install dependencies
        run: npm install

      - name: Update slides
        run: npm run update-slides

      - name: Check for changes
        id: check-for-changes
        shell: bash {0}
        run: |
          git diff --exit-code src/data/
          exit_code=$?
          if [ $exit_code -eq 0 ]; then
            echo "No changes detected"
            exit 0
          elif [ $exit_code -eq 1 ]; then
            echo "exit_code=$exit_code" >> $GITHUB_OUTPUT
            echo "Changes detected"
            exit 0
          fi
          echo "An error occurred"
          exit $exit_code

      - name: Check for existing PR
        if: ${{ steps.check-for-changes.outputs.exit_code == '1' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        id: check-pr
        run: |
          existing_pr=$(gh pr list --search "label:\"Update slides\" is:open" --json number --jq length)
          if [ "$existing_pr" -gt "0" ]; then
            echo "existing_pr=true" >> $GITHUB_OUTPUT
            echo "Found existing open Update Slides PR, skipping PR creation"
            exit 0
          fi
          echo "existing_pr=false" >> $GITHUB_OUTPUT

      - name: Install Playwright Browsers
        if: ${{ steps.check-for-changes.outputs.exit_code == '1' && steps.check-pr.outputs.existing_pr == 'false' }}
        run: npx playwright install --with-deps

      - name: Update snapshots
        if: ${{ steps.check-for-changes.outputs.exit_code == '1' && steps.check-pr.outputs.existing_pr == 'false' }}
        run: npm run update-snapshots

      - name: Create Pull Request
        if: ${{ steps.check-for-changes.outputs.exit_code == '1' && steps.check-pr.outputs.existing_pr == 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: 'Asia/Tokyo'
        run: |
          current_datetime=$(date +"%Y-%m-%d %H:%M:%S")
          branch_name="update-slides/$(date +%Y-%m-%d-%H-%M-%S)"

          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git checkout -b $branch_name
          git add src/data/ tests/
          git commit -m "Update slides - $current_datetime"
          git push origin $branch_name

          gh pr create \
            --title "Update slides - $current_datetime" \
            --body "This PR was automatically created by the Update Slides workflow." \
            --base main \
            --head $branch_name \
            --label "Update slides"

      - name: Report failure
        if: failure()
        id: report-failure
        uses: actions/github-script@v7
        with:
          script: |
            const dedupeLabel = 'update-slides-failure';
            const labels = ['workflow-failure', dedupeLabel];
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Update Slides ワークフローが失敗しました: ${runUrl}`;
            const { data: existing } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: dedupeLabel,
            });
            if (existing.length > 0) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing[0].number, body,
              });
              core.setOutput('issue_number', existing[0].number);
              core.setOutput('is_new', 'false');
            } else {
              const { data: created } = await github.rest.issues.create({
                ...context.repo,
                title: 'Update Slides workflow failing',
                body, labels,
              });
              core.setOutput('issue_number', created.number);
              core.setOutput('is_new', 'true');
            }

      - name: Analyze failure with Claude
        if: failure() && steps.report-failure.outputs.is_new == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: |
            Update Slides ワークフロー (run ${{ github.run_id }}) が失敗しました。
            原因を調査し、Issue #${{ steps.report-failure.outputs.issue_number }} に
            原因と修正方針をコメントしてください。PR は作成しないでください。
          claude_args: '--allowed-tools "Bash(gh run view:*),Bash(gh issue view:*),Bash(gh issue comment:*)"'
